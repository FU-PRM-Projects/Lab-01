[package]
name = "lab_05_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
pdf-inspector = "1.19.0"
regex = "1.10"
arrow-array = "58.4"
arrow-schema = "58.4"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
lancedb = { version = "0.39.0", features = ["remote"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
tempfile = "3"

# No [profile.release] tuning is applied. `strip` is a no-op on windows-msvc
# (debug info lives in a separate .pdb), and `panic = "abort"` must never be set:
# flutter_rust_bridge relies on unwinding to turn Rust panics into Dart
# exceptions. LTO would trade a much longer build for a smaller DLL; untried.
